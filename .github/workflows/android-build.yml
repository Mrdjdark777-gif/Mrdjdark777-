name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Выложить APK на сайт: положить в public/app и обновить lib/app-release.ts коммитом в эту ветку"
        type: boolean
        default: false
  push:
    branches: [design/six-screens]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # Запись нужна только шагу «выложить на сайт» (коммит APK в ветку).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release signing key and Firebase config
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/truethrills-release.jks"
          echo "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > "android/app/google-services.json"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Build signed APK
        run: gradle -p android assembleRelease lintRelease
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/truethrills-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Rename APK with version
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/TrueThrills-Android-${version}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TrueThrills-Android-apk
          path: ${{ runner.temp }}/out/*.apk
          retention-days: 30

      # По просьбе (publish=true): новый APK — на сайт. Файл ложится в
      # public/app вместо прежнего, lib/app-release.ts получает его размер и
      # сумму, tests/unit/app-release.mjs проверяет, и всё это — одним коммитом в
      # ту же ветку. Сервер получит его обычным обновлением.
      - uses: actions/setup-node@v5
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          node-version: "22"
      - name: Publish APK to the site
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          code=$(sed -n "s/.*versionCode \([0-9]*\);.*/\1/p" android/app/build.gradle)
          git rm -q --ignore-unmatch 'public/app/*.apk'
          # git rm убирает и папку, если в ней был один файл: без mkdir cp падал
          # «No such file or directory» (первая выкладка 0.9.4).
          mkdir -p public/app
          cp "$RUNNER_TEMP/out/TrueThrills-Android-${version}.apk" "public/app/TrueThrills-${version}.apk"
          npm ci --ignore-scripts --no-audit --no-fund
          node tools/dev/set-app-release.mjs "$version" "$code" "public/app/TrueThrills-${version}.apk"
          node tests/unit/app-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app lib/app-release.ts
          git commit -m "Android ${version}: APK на сайте (сборка ${GITHUB_RUN_ID})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
