name: Web checks
on:
  workflow_dispatch: {}
  push:
    branches: [design/six-screens]
  pull_request:
    branches: [design/six-screens]
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    # Браузерные наборы, дизайн, читалка, плеер и главная идут друг за другом.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Решения об уведомлениях в приложении Android вынесены в чистый класс
      # без Android: tests/integration/android-push-logic.mjs компилирует его настоящим
      # javac и гоняет на JVM, поэтому SDK и эмулятор не нужны.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Часть проверок гоняет настоящие ffmpeg/ffprobe.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --include=dev
      - name: Check server script syntax
        run: bash -n server/update-safe.sh server/install-operations.sh server/backup-service.sh server/export-backup.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/windows/TrueThrills-Server.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - run: npm run lint
      # Список проверок один — в package.json, а tests/guards/suite-complete.mjs
      # следит, что ни один файл не остался без запуска. «npm test» сам
      # собирает проект, отдельный build не нужен и браузер ему не нужен.
      - run: npm test
      # Этому нужен поднятый сервер и настоящий FFmpeg.
      - run: node tests/integration/live-archive-integration.mjs
      # Браузер ставится ДО браузерных проверок. Раньше установка стояла после
      # «npm test», а сами проверки были внутри него: на чистой машине прогон
      # падал на первой из них, потому что playwright ещё не был установлен.
      # Теперь playwright — закреплённая devDependency и приезжает с npm ci,
      # здесь остаётся только сам браузер.
      # Два браузера. Google Chrome — для проверок, которые берут браузер из
      # TT_BROWSER_EXECUTABLE: в нём есть AAC, без которого эфир в
      # browser-integration не играет. Встроенный Chromium — для проверок,
      # которые запускают браузер Playwright без пути (читалка, плеер, главная).
      # Раньше ставился только Chrome, и первая же проверка падала:
      # «Executable doesn't exist … chromium_headless_shell».
      - run: npx playwright install chrome chromium
      - run: echo "TT_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm run test:browser
      # Экраны нового дизайна на production-сборке: снимки в артефакт, главная
      # без переполнения и без прокрутки на трёх телефонах.
      - run: npm run test:design
      - name: Reader, player and home regressions
        run: npm run test:reader && npm run test:player-enhancements && npm run test:home-depth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrueThrills-UI-checks
          path: outputs/ui/*.png
          retention-days: 14
