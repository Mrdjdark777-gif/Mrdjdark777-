name: Web checks
on:
  workflow_dispatch: {}
  push:
    branches: [claude/read-link-content-h18psv]
  pull_request:
    branches: [claude/read-link-content-h18psv]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run build
      - run: node tests/api-integration.mjs
      - run: node tests/backup-integration.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/browser-integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrueThrills-UI-checks
          path: outputs/ui/*.png
          retention-days: 14
