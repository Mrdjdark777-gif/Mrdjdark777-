name: Web checks
on:
  workflow_dispatch: {}
  push:
    branches: [truethrills-app]
  pull_request:
    branches: [truethrills-app]
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Решения об уведомлениях в приложении Android вынесены в чистый класс
      # без Android: tests/android-push-logic.mjs компилирует его настоящим
      # javac и гоняет на JVM, поэтому SDK и эмулятор не нужны.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Часть проверок гоняет настоящие ffmpeg/ffprobe.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --include=dev
      - name: Check server script syntax
        run: bash -n scripts/update-safe.sh scripts/install-operations.sh scripts/backup-service.sh scripts/export-backup.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/TrueThrills-Server.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - run: npm run lint
      # Раньше здесь стоял перечень проверок, и он разошёлся с package.json:
      # из двадцати шести проверок CI гонял одиннадцать, а про остальные знал
      # только «npm test». Теперь список один — в package.json, а
      # tests/suite-complete.mjs следит, что ни один файл не остался без
      # запуска. «npm test» сам собирает проект, отдельный build не нужен.
      - run: npm test
      # Этим нужен браузер или поднятый сервер, поэтому они идут отдельно.
      - run: node tests/live-archive-integration.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chrome
      - run: node tests/browser-integration.mjs
      # Экраны нового дизайна на production-сборке: снимки в артефакт, главная
      # без переполнения и без прокрутки на трёх телефонах.
      - run: node tests/design-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrueThrills-UI-checks
          path: outputs/ui/*.png
          retention-days: 14
