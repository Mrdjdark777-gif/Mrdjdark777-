name: Web checks
on:
  workflow_dispatch: {}
  push:
    branches: [truethrills-app]
  pull_request:
    branches: [truethrills-app]
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Решения об уведомлениях в приложении Android вынесены в чистый класс
      # без Android: tests/android-push-logic.mjs компилирует его настоящим
      # javac и гоняет на JVM, поэтому SDK и эмулятор не нужны.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Часть проверок гоняет настоящие ffmpeg/ffprobe.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --include=dev
      - name: Check server script syntax
        run: bash -n scripts/update-safe.sh scripts/install-operations.sh scripts/backup-service.sh scripts/export-backup.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/TrueThrills-Server.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - run: npm run lint
      # Список проверок один — в package.json, а tests/suite-complete.mjs
      # следит, что ни один файл не остался без запуска. «npm test» сам
      # собирает проект, отдельный build не нужен и браузер ему не нужен.
      - run: npm test
      # Этому нужен поднятый сервер и настоящий FFmpeg.
      - run: node tests/live-archive-integration.mjs
      # Браузер ставится ДО браузерных проверок. Раньше установка стояла после
      # «npm test», а сами проверки были внутри него: на чистой машине прогон
      # падал на первой из них, потому что playwright ещё не был установлен.
      # Теперь playwright — закреплённая devDependency и приезжает с npm ci,
      # здесь остаётся только сам браузер.
      - run: npx playwright install chrome
      - run: npm run test:browser
      # Экраны нового дизайна на production-сборке: снимки в артефакт, главная
      # без переполнения и без прокрутки на трёх телефонах.
      - run: npm run test:design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TrueThrills-UI-checks
          path: outputs/ui/*.png
          retention-days: 14
