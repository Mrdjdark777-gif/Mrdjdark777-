name: Web checks
on:
  push:
    branches: [claude/read-link-content-h18psv, codex/stabilize-0.8]
  pull_request:
    branches: [claude/read-link-content-h18psv]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run build
      - run: node tests/api-integration.mjs
      - run: node tests/backup-integration.mjs
